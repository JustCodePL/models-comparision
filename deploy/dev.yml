services:
  nginx:
    image: ${DOCKER_IMAGE_NAME}
    networks:
      - traefik
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.models_comparision_justcode_ovh.rule=Host(`models-comparision.justcode.ovh`)
        - traefik.http.routers.models_comparision_justcode_ovh.entrypoints=web
        - traefik.http.routers.models_comparision_justcode_ovh.service=models_comparision_justcode_ovh
        - "traefik.http.middlewares.models_comparision_basicauth.basicauth.users=${BASIC_AUTH_USERS}"
        - traefik.http.routers.models_comparision_justcode_ovh.middlewares=models_comparision_basicauth
        - traefik.http.services.models_comparision_justcode_ovh.loadbalancer.server.port=80

networks:
  traefik:
    external: true
