services:
  nginx:
    image: ${DOCKER_IMAGE_NAME}
    networks:
      - traefik
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.models_comparision_justcode_ac.rule=Host(`models-comparision.justcode.ac`)
        - traefik.http.routers.models_comparision_justcode_ac.entrypoints=websecure
        - traefik.http.routers.models_comparision_justcode_ac.tls=true
        - traefik.http.routers.models_comparision_justcode_ac.tls.certresolver=letsencrypt
        - traefik.http.routers.models_comparision_justcode_ac.service=models_comparision_justcode_ac
        - traefik.http.services.models_comparision_justcode_ac.loadbalancer.server.port=80

networks:
  traefik:
    external: true
