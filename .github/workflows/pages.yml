name: Publikacja GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testy, ewaluacja i eksport
        run: npm test
        env:
          PAGE_URL: https://models-comparision.justcode.ac
          ENABLE_ROBOTS: "1"
          MEDIA_BASE_URL: https://models-comparision-media.justcode.ac
          TRACKING_SCRIPT_URL: https://statystyki.justcode.ac/script.js
          TRACKING_ID: 3daa0536-1aec-497c-ab42-e8029833f504
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
