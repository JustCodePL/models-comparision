name: Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: JustCodePL/Actions/.github/workflows/build-and-publish-docker-image.yml@main
    with:
      env: dev
      docker_image_name: ghcr.io/justcodepl/models-comparision:${{ github.sha }}-dev
      dockerfile_path: actions/dockerfiles/NextJSStatic/Dockerfile
      docker_platform: linux/amd64
      runs_on: '{"group":"Private macOS Builders","labels":"justcode"}'
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      INFISICAL_TOKEN_APP: ${{ secrets.INFISICAL_TOKEN_APP_DEV }}

  deploy:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: JustCodePL/Actions/.github/workflows/deploy-stack.yml@main
    with:
      env: dev
      stack_name: models_comparision_justcode_ovh
      stack_file: deploy/dev.yml
      docker_image_name: ghcr.io/justcodepl/models-comparision:${{ github.sha }}-dev
      runs_on: '{"group":"Private macOS Builders","labels":"justcode"}'
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      INFISICAL_TOKEN_CI: ${{ secrets.INFISICAL_TOKEN_CI_DEV }}
      INFISICAL_TOKEN_APP: ${{ secrets.INFISICAL_TOKEN_APP_DEV }}

  cleanup:
    needs: deploy
    uses: JustCodePL/Actions/.github/workflows/swarm-cleanup.yml@main
    with:
      env: dev
      runs_on: '{"group":"Private macOS Builders","labels":"justcode"}'
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      INFISICAL_TOKEN_CI: ${{ secrets.INFISICAL_TOKEN_CI_DEV }}
